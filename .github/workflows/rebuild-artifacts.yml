name: rebuild-artifacts

# 一次性工具：在与 frontend-artifacts 闸门**完全相同**的环境里重建前端产物，
# 并把重建结果打包上传（闸门本身只校验、不产出）。
# 用途：当闸门报「产物与源码不同源」时，取本工作流产出的快照直接入库，
# 即可保证逐字节同源。用完即可删除本文件（它是 workflow_dispatch-only，不会自动跑）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop-tauri/ui-kit/package-lock.json
            desktop-tauri/ui-islands/package-lock.json
            desktop-tauri/mobile/package-lock.json
            desktop-tauri/i18n/package-lock.json

      - name: 安装依赖
        run: |
          npm --prefix desktop-tauri/ui-kit ci
          npm --prefix desktop-tauri/ui-islands ci
          npm --prefix desktop-tauri/mobile ci
          npm --prefix desktop-tauri/i18n ci

      - name: 重建产物
        run: |
          npm --prefix desktop-tauri/ui-islands run build
          npm --prefix desktop-tauri/mobile run build
          npm --prefix desktop-tauri/i18n run build

      - name: 差异清单
        run: |
          echo "=== 重建后与入库内容的差异 ==="
          git status --porcelain -- desktop-tauri/ui
          echo "=== 文件哈希（供核对）==="
          find desktop-tauri/ui -type f | sort | xargs shasum -a 256 > /tmp/ui-hashes.txt
          head -50 /tmp/ui-hashes.txt

      - name: 上传重建后的 ui/ 目录
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-ui
          path: desktop-tauri/ui
          retention-days: 1